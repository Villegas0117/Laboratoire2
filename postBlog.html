<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoi de Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <h1 class="text-center mb-4">Ajouter un Blog</h1>
        </div>
        <div class="card p-4 shadow" role="form">
            <h2 class="text-center mb-4">Formulaire</h2>
            <form id="blogForm">
                <div class="mb-3">
                    <label for="title" class="form-label">Titre:</label>
                    <input type="text" id="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="author" class="form-label">Auteur:</label>
                    <input type="text" id="author" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">Contenu:</label>
                    <textarea id="content" class="form-control" rows="5" required></textarea>
                </div>
                <button id="ButtonPost" type="submit" class="btn btn-primary w-100">Publier</button>
            </form>
        </div>
    </div>

    <!-- Ventana de alerta personalizada -->
    <div id="customAlert" title="Resultado de la Publicación" style="display:none;">
        <p id="alertMessage"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="postBlog.js" crossorigin="anonymous"></script>

</body>

</html>
